# Build every push and pull request.
#
# Windows only, because the app targets net8.0-windows: it uses WPF, which does
# not build anywhere else.
#
# The tests cover the parts that fail quietly: which files a destination owns and
# will therefore delete, whether two destinations overlap, and whether a
# published version is newer than the one running. None of those announce
# themselves when they go wrong - a version comparison that is too shy simply
# never mentions a release again - which is why they are checked here rather
# than noticed later.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore D2RExtractor.sln

      - name: Build
        run: dotnet build D2RExtractor.sln --no-restore -c Release

      - name: Test
        run: dotnet test D2RExtractor.sln --no-build -c Release --verbosity normal
